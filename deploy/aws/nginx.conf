# HerePilot-AI: nginx in front of the app (installed as /etc/nginx/nginx.conf).
#
# Traffic path:  browser --HTTPS--> CloudFront --HTTP:80--> this nginx --> uvicorn on 127.0.0.1:8000
#
# PUBLIC: anyone with the CloudFront URL can use the app. There is no login and no origin secret.
# What still protects it:
#   1. Security group: port 80 is open only to the CloudFront origin-facing prefix list.
#   2. Rate limits: per client and overall (below). /api/chat is the one that can cost money.
#   3. A usage cap inside the backend limits Bedrock calls per hour and per day (see BEDROCK_*_CALL_LIMIT).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    types_hash_max_size 4096;
    types_hash_bucket_size 128;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Behind CloudFront $remote_addr is an edge server. CloudFront appends the viewer address to the
    # end of X-Forwarded-For, so the last entry is the client as CloudFront saw it.
    map $http_x_forwarded_for $client_ip {
        default $remote_addr;
        "~(?<last_hop>[^,\s]+)\s*$" $last_hop;
    }

    # Access log: method and path only. Query strings carry what people type into search, so they are not logged.
    log_format herepilot '$client_ip $remote_user [$time_local] "$request_method $uri" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log herepilot;

    limit_req_status 429;
    limit_req_zone $client_ip   zone=chat:10m     rate=20r/m;   # AI calls cost money: 20 per minute per client
    limit_req_zone $server_name zone=chat_all:1m  rate=30r/m;   # ...and 30 per minute across ALL clients
    limit_req_zone $client_ip zone=api:10m    rate=10r/s;
    limit_req_zone $client_ip zone=static:10m rate=20r/s;

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 64k;   # chat messages are capped at 2000 characters

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Proxy settings shared by the /api locations (inherited because the locations set none of their own).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;                  # CloudFront gives up at 60s; chats take 5-40s
        proxy_send_timeout 75s;

        location = /api/chat {
            limit_req zone=chat burst=10 nodelay;
            limit_req zone=chat_all burst=20 nodelay;
            proxy_pass http://127.0.0.1:8000/chat;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://127.0.0.1:8000/;    # strips the /api prefix
        }

        # Built frontend (frontend/dist). File names under /assets are content-hashed.
        location /assets/ {
            limit_req zone=static burst=60 nodelay;
            root /srv/herepilot-ai/frontend/dist;
            expires 7d;
            try_files $uri =404;
        }

        location / {
            limit_req zone=static burst=60 nodelay;
            root /srv/herepilot-ai/frontend/dist;
            expires -1;
            try_files $uri /index.html;
        }
    }
}
