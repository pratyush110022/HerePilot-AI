name: CI

# Offline checks for the application. This workflow never calls HERE, AWS or any other provider:
# tests use fakes, provider credentials are blank, and no secrets are read.
# (The portfolio deploy workflow is separate and is not touched by this file.)
on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # Belt and braces: even if a .env existed, no test could reach a provider.
      HERE_API_KEY: ""
      LLM_PROVIDER: "none"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit and API tests (offline)
        run: python -m pytest -q

      - name: Orchestrator smoke test (offline)
        run: python tests/smoke_orchestrator.py
        env:
          PYTHONPATH: .

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        # The build bundles a public placeholder; real keys are never needed to compile.
        run: npm run build
        env:
          VITE_BACKEND_URL: http://localhost:8000
          VITE_HERE_API_KEY: ""
