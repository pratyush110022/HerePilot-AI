[pytest]
# Collect only backend/tests. backend/test_groq.py is a manual script that calls
# the live Groq API at import time and must never be collected by pytest.
testpaths = tests
addopts = --ignore=test_groq.py
# Same effect as `python -m pytest`: make `services.*` importable from backend/.
pythonpath = .
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
